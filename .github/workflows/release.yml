name: Release extension

# Manual only. Building is cheap and fast, but a release is a thing other people
# download, so it happens when someone decides it should — not on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: main
      platform:
        description: "Which package to build"
        required: false
        type: choice
        options:
          - both
          - windows
          - macos
        default: both
      draft:
        description: "Draft release (visible only to you, not downloadable without signing in)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    # macOS, not Linux. There is no Linux build of this: the platform files
    # cover darwin and windows only, so `go test ./...` on a Linux runner fails
    # to compile before it runs anything. Tests have to execute somewhere they
    # are supported, and macOS is one of the two shipping targets. Windows is
    # covered by cross-compiling `go vet` from here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      # A release is the wrong place to discover a broken build, and neither
      # target can be run here, so the compiler and the tests are the only gate
      # there is. Both platforms, because most of what changes is per-platform.
      - name: Vet and test both targets
        working-directory: whatsapp-bridge
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

      - name: Build the package
        env:
          # Pinned rather than left to follow the host: the extension targets
          # Apple silicon, and this should not silently become an Intel build if
          # the runner image ever changes architecture.
          DARWIN_ARCH: arm64
        run: |
          case "${{ inputs.platform }}" in
            macos) target=darwin ;;
            *)     target="${{ inputs.platform }}" ;;
          esac
          ./installer/build-mcpb.sh "$target"

      # The version is not an input: it lives in whatsapp-bridge/main.go, the
      # manifest must agree with it (build-mcpb.sh fails otherwise), and the
      # self-install compares the two to refuse a downgrade. Taking it from the
      # source keeps one source of truth instead of three.
      - name: Read version and locate the package
        id: pkg
        run: |
          version="$(grep -o 'appVersion = "[^"]*"' whatsapp-bridge/main.go | cut -d'"' -f2)"
          case "${{ inputs.platform }}" in
            both)    file="installer/WhatsApp-Assistant-Windows-x64-and-macOS-AppleSilicon.mcpb" ;;
            windows) file="installer/WhatsApp-Assistant-Windows-x64.mcpb" ;;
            macos)   file="installer/WhatsApp-Assistant-macOS-AppleSilicon.mcpb" ;;
          esac
          [ -f "$file" ] || { echo "::error::expected package not found: $file"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Built $file for v$version ($(du -h "$file" | cut -f1))"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pkg.outputs.version }}
          FILE: ${{ steps.pkg.outputs.file }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          # Written line by line rather than as one multi-line string: inside a
          # YAML block scalar every line has to stay indented, and indented
          # lines would reach Markdown as code blocks.
          {
            echo "### Which file do I need?"
            echo
            echo "| Your computer | Download |"
            echo "| --- | --- |"
            echo "| **Windows 10 or 11**, 64-bit | \`WhatsApp-Assistant-Windows-x64.mcpb\` |"
            echo "| **Mac with an Apple chip** (M1/M2/M3/M4) | \`WhatsApp-Assistant-macOS-AppleSilicon.mcpb\` |"
            echo
            echo "Not supported: Intel Macs, 32-bit Windows, and Windows on ARM."
            echo "(The extension manifest says \`win32\`, which is the platform name Claude uses for Windows generally — not a 32-bit build.)"
            echo
            echo "### Install"
            echo
            echo "Download the file for your computer, then in Claude open **Settings -> Extensions** and drag it in. Start a new chat and say *check my whatsapp status*."
            echo
            echo "Updating from an earlier version? Install over the top. Your messages and your WhatsApp link are kept, and the background service updates itself."
            echo
            echo "First run downloads a 1.5 GB speech model in the background, once, so voice notes can be transcribed on your own machine."
            echo
            echo "Full guides: [Windows]($REPO_URL/blob/main/installer/README-windows.md) | [macOS]($REPO_URL/blob/main/installer/README.md)"
            echo
            echo "---"
            echo "Built from \`${{ inputs.ref }}\` (\`$sha\`)."
          } > "$RUNNER_TEMP/notes.md"

          # Re-running for a second platform must add to the existing release
          # rather than replace it, so create only when the tag is new.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing its notes and adding this asset."
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "WhatsApp Assistant $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              ${{ inputs.draft && '--draft' || '' }}
          fi
          gh release upload "$TAG" "$FILE" --clobber
          {
            echo "### Released $TAG"
            gh release view "$TAG" --json url -q .url
          } >> "$GITHUB_STEP_SUMMARY"
